name: CI

on:
  push:
  pull_request:

jobs:
  run-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run on sample data
        run: python seo_cluster.py sample_data.csv -o out.xlsx -b /canapes/
      - name: Check output
        run: test -s out.xlsx
